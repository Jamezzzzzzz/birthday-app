<!DOCTYPE html>
<html>
<head>
    <title>生日大挑戰!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; font-family: sans-serif;">

    <div style="margin-bottom: 20px;">
        <h2 style="color: #db2777; margin: 0;">💰 錢包: ${{ session['money'] }}</h2>
        <a href="/shop" style="text-decoration: none;">
            <button type="button" style="margin-top: 10px; background: white; border: 2px solid #f472b6; color: #f472b6; padding: 5px 15px; border-radius: 20px; cursor: pointer;">
                🛒 前往超商
            </button>
        </a>
    </div>

    <div style="background: white; border-radius: 25px; padding: 40px; width: 90%; max-width: 500px; box-shadow: 0 15px 25px rgba(0,0,0,0.1); border: 2px solid #fce7f3;">
        
        <h3 style="color: #9d174d; margin-top: 0;">第 {{ q_idx + 1 }} 題</h3>
        <p style="font-size: 1.4rem; color: #333; margin-bottom: 25px;">{{ question.q }}</p>

        {% if error_msg %}
            <div style="background: #fff1f2; color: #e11d48; padding: 10px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #fda4af; font-size: 0.9rem;">
                {{ error_msg }}
            </div>
        {% endif %}

        <form method="POST">
            <input type="text" name="answer" placeholder="在這邊輸入答案..." required autofocus 
                   style="width: 80%; padding: 12px; border-radius: 10px; border: 2px solid #fbcfe8; font-size: 1rem; outline: none;">
            <br><br>
            <button type="submit" style="background: #ec4899; color: white; border: none; padding: 12px 30px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s;">
                送出答案
            </button>
        </form>

        <hr style="border: 0; border-top: 1px solid #f3f4f6; margin: 30px 0;">

        <a href="{{ url_for('skip', q_idx=q_idx) }}" style="color: #9ca3af; font-size: 0.9rem; text-decoration: none;">
            這題太難了，先跳過 (沒錢拿喔) ➔
        </a>
    </div>

</body>
</html>
